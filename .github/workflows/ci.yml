name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a branch makes the in-flight run for that branch pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repo. Stated explicitly so a future step cannot
# silently inherit more than it needs.
permissions:
  contents: read

jobs:
  build:
    name: typecheck & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Must come before setup-node: the pnpm cache lookup needs pnpm on PATH.
      # The version comes from `packageManager` in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      # --frozen-lockfile fails if pnpm-lock.yaml is out of date with the
      # manifests. Note this also runs `prepare` (bob build), so a broken
      # build surfaces here rather than in the Build step below.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck library
        run: pnpm typecheck

      # The example is the only place the published API is consumed by real
      # code, so this is what catches an accidental breaking change.
      - name: Typecheck example
        run: pnpm --filter react-native-onboarding-steps-example typecheck

      - name: Build
        run: pnpm build
